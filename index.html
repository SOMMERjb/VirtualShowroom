<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Virtual Showroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0d; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    color: #eee; font: 14px/1.4 system-ui, sans-serif; opacity: 0.75;
    background: rgba(0,0,0,0.35); padding: 8px 14px; border-radius: 8px;
    pointer-events: none; user-select: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #eee; font: 16px system-ui, sans-serif; background: #0b0b0d; z-index: 10;
  }
</style>
</head>
<body>
<div id="loading">Showroom wird geladen…</div>
<div id="hint">Maus ziehen: drehen &nbsp;|&nbsp; Scrollen: zoomen &nbsp;|&nbsp; Rechtsklick ziehen: schwenken</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const loadingEl = document.getElementById("loading");

// --- Basic setup ---------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111114);
scene.fog = new THREE.Fog(0x111114, 12, 30);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6, 3.2, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

// --- Room ------------------------------------------------------------
const roomSize = 12;
const wallHeight = 5;

const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.35, metalness: 0.05 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x1c1c20, roughness: 0.9, side: THREE.DoubleSide });

const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, wallHeight), wallMat);
backWall.position.set(0, wallHeight / 2, -roomSize / 2);
backWall.receiveShadow = true;
scene.add(backWall);

const sideWallGeo = new THREE.PlaneGeometry(roomSize, wallHeight);
const leftWall = new THREE.Mesh(sideWallGeo, wallMat);
leftWall.position.set(-roomSize / 2, wallHeight / 2, 0);
leftWall.rotation.y = Math.PI / 2;
leftWall.receiveShadow = true;
scene.add(leftWall);

const rightWall = new THREE.Mesh(sideWallGeo, wallMat);
rightWall.position.set(roomSize / 2, wallHeight / 2, 0);
rightWall.rotation.y = -Math.PI / 2;
rightWall.receiveShadow = true;
scene.add(rightWall);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), wallMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = wallHeight;
scene.add(ceiling);

// Subtle floor grid for orientation
const grid = new THREE.GridHelper(roomSize, 24, 0x444448, 0x2a2a2e);
grid.position.y = 0.001;
scene.add(grid);

// --- Lighting ------------------------------------------------------------
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const keyLight = new THREE.SpotLight(0xffffff, 220, 20, Math.PI / 5, 0.4, 1.2);
keyLight.position.set(0, wallHeight - 0.2, 0);
keyLight.target.position.set(0, 0, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0005;
scene.add(keyLight, keyLight.target);

// Two accent ceiling spots over the pedestals
function addSpot(x, z) {
  const spot = new THREE.SpotLight(0xfff2e0, 90, 14, Math.PI / 7, 0.5, 1.5);
  spot.position.set(x, wallHeight - 0.1, z);
  spot.target.position.set(x, 0, z);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  scene.add(spot, spot.target);
}
addSpot(-3, -1.5);
addSpot(3, -1.5);

// A soft rim light from the back
const rim = new THREE.PointLight(0x88aaff, 20, 15);
rim.position.set(0, 2, -5.5);
scene.add(rim);

// --- Showroom "Leuchtkasten" (illuminated display box) -------------------
function createLightbox(x, z) {
  const group = new THREE.Group();

  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 1.0, 0.15),
    new THREE.MeshStandardMaterial({ color: 0x222226, roughness: 0.4, metalness: 0.3 })
  );
  group.add(frame);

  const panel = new THREE.Mesh(
    new THREE.PlaneGeometry(1.4, 0.8),
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xfff6e0,
      emissiveIntensity: 1.6,
      roughness: 0.6,
    })
  );
  panel.position.z = 0.08;
  group.add(panel);

  const glow = new THREE.PointLight(0xfff2d0, 8, 4);
  glow.position.set(0, 0, 0.3);
  group.add(glow);

  group.position.set(x, 2.1, z);
  return group;
}
const lightbox = createLightbox(0, -roomSize / 2 + 0.09);
scene.add(lightbox);

// --- Pedestals with showcase objects --------------------------------------
const pedestalMat = new THREE.MeshStandardMaterial({ color: 0xe8e8ea, roughness: 0.5, metalness: 0.1 });

function createPedestal(x, z, height = 0.9) {
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.6, height, 32), pedestalMat);
  pedestal.position.set(x, height / 2, z);
  pedestal.castShadow = true;
  pedestal.receiveShadow = true;
  return pedestal;
}

function createShowpiece(geometry, material, x, y, z) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const showpieces = [];

// Piece 1: gold torus knot
{
  const pedestal = createPedestal(-3, -1.5);
  scene.add(pedestal);
  const mat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.25, metalness: 0.9 });
  const piece = createShowpiece(new THREE.TorusKnotGeometry(0.35, 0.12, 150, 20), mat, -3, 0.9 + 0.4, -1.5);
  scene.add(piece);
  showpieces.push(piece);
}

// Piece 2: glass-like icosahedron
{
  const pedestal = createPedestal(3, -1.5);
  scene.add(pedestal);
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x88ccff, roughness: 0.05, metalness: 0, transmission: 0.9,
    thickness: 0.5, ior: 1.4, clearcoat: 1,
  });
  const piece = createShowpiece(new THREE.IcosahedronGeometry(0.5, 0), mat, 3, 0.9 + 0.5, -1.5);
  scene.add(piece);
  showpieces.push(piece);
}

// Piece 3: matte ceramic sphere, centerpiece
{
  const pedestal = createPedestal(0, 1.2, 1.1);
  scene.add(pedestal);
  const mat = new THREE.MeshStandardMaterial({ color: 0xc23b3b, roughness: 0.35, metalness: 0.0 });
  const piece = createShowpiece(new THREE.SphereGeometry(0.5, 48, 32), mat, 0, 1.1 + 0.5, 1.2);
  scene.add(piece);
  showpieces.push(piece);
}

// --- Resize handling -------------------------------------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Render loop -----------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  showpieces.forEach((piece, i) => {
    piece.rotation.y = t * 0.5 + i;
  });
  controls.update();
  renderer.render(scene, camera);
}

loadingEl.style.display = "none";
animate();
</script>
</body>
</html>
