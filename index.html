<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const loadingEl = document.getElementById("loading");

// --- Basic setup ---------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6e8);

const ROOM_W = 6.4;
const ROOM_D = 6.0;
const ROOM_H = 2.8;
const WALL_MARGIN = 0.35;

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.4, 1.75, 2.35);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 1.2, -0.6);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 5.2;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

// Hard clamp so the camera can never pass through a wall/floor/ceiling,
// regardless of how OrbitControls' internal spherical math plays out.
function clampCameraToRoom() {
  camera.position.x = THREE.MathUtils.clamp(camera.position.x, -ROOM_W / 2 + WALL_MARGIN, ROOM_W / 2 - WALL_MARGIN);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z, -ROOM_D / 2 + WALL_MARGIN, ROOM_D / 2 - WALL_MARGIN);
  camera.position.y = THREE.MathUtils.clamp(camera.position.y, 0.35, ROOM_H - 0.15);
}

// --- Procedural calming-graphic textures (no external image assets) ------
function makeCanvasTexture(w, h, draw) {
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function softBlob(ctx, x, y, r, color) {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, color);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function texMeadowWide(w = 2048, h = 768) {
  return makeCanvasTexture(w, h, (ctx) => {
    const sky = ctx.createLinearGradient(0, 0, 0, h * 0.65);
    sky.addColorStop(0, "#bfe3e8");
    sky.addColorStop(1, "#e8f3ea");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h * 0.65);

    softBlob(ctx, w * 0.82, h * 0.18, w * 0.16, "rgba(255,247,214,0.9)");

    ctx.fillStyle = "#e8f3ea";
    ctx.fillRect(0, h * 0.6, w, h * 0.4);

    const hillColors = ["#9ecab0", "#7fb897", "#5c9e7c"];
    hillColors.forEach((color, i) => {
      const baseY = h * (0.62 + i * 0.11);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, baseY + 30);
      for (let x = 0; x <= w; x += w / 10) {
        const y = baseY + Math.sin((x / w) * Math.PI * 2 + i) * 22;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();
    });

    for (let i = 0; i < 26; i++) {
      const x = (i / 26) * w + (i % 2) * 20;
      const y = h * 0.86 + (i % 3) * 14;
      softBlob(ctx, x, y, 34, "rgba(90,140,110,0.55)");
    }
  });
}

function texWaterPanel(w = 900, h = 1400) {
  return makeCanvasTexture(w, h, (ctx) => {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#bfe0e8");
    grad.addColorStop(0.5, "#8fc4d6");
    grad.addColorStop(1, "#4f93ac");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 6;
    for (let i = 0; i < 10; i++) {
      const y = (i / 10) * h + 40;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 20) {
        const yy = y + Math.sin((x / w) * Math.PI * 4 + i) * 18;
        if (x === 0) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    softBlob(ctx, w * 0.25, h * 0.15, w * 0.35, "rgba(255,255,255,0.5)");
  });
}

function texSkyCeiling(w = 1600, h = 1200) {
  return makeCanvasTexture(w, h, (ctx) => {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#bfe0f5");
    grad.addColorStop(1, "#e9f5fb");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    const rand = mulberry32(7);
    for (let i = 0; i < 9; i++) {
      const cx = rand() * w;
      const cy = rand() * h * 0.8;
      const r = 90 + rand() * 140;
      softBlob(ctx, cx, cy, r, "rgba(255,255,255,0.85)");
      softBlob(ctx, cx + r * 0.4, cy + r * 0.15, r * 0.7, "rgba(255,255,255,0.7)");
    }
  });
}

// Deterministic PRNG so the sky texture is stable across reloads.
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function texClinicalFloor(w = 512, h = 512) {
  return makeCanvasTexture(w, h, (ctx) => {
    ctx.fillStyle = "#d7dcdb";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(120,130,128,0.25)";
    ctx.lineWidth = 2;
    const tile = w / 4;
    for (let i = 0; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(i * tile, 0);
      ctx.lineTo(i * tile, h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * tile);
      ctx.lineTo(w, i * tile);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.06;
    const rand = mulberry32(3);
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = rand() > 0.5 ? "#000" : "#fff";
      ctx.fillRect(rand() * w, rand() * h, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  });
}

// --- Room shell ------------------------------------------------------------
const floorTex = texClinicalFloor();
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(ROOM_W / 1.6, ROOM_D / 1.6);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM_W, ROOM_D),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xeef2f2, roughness: 0.92 });
const baseboardMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });

function addBaseboard(x, z, length, rotationY) {
  const board = new THREE.Mesh(new THREE.BoxGeometry(length, 0.09, 0.02), baseboardMat);
  board.position.set(x, 0.045, z);
  board.rotation.y = rotationY;
  board.receiveShadow = true;
  scene.add(board);
}

const backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), wallMat);
backWall.position.set(0, ROOM_H / 2, -ROOM_D / 2);
backWall.receiveShadow = true;
scene.add(backWall);
addBaseboard(0, -ROOM_D / 2 + 0.01, ROOM_W, 0);

const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, ROOM_H), wallMat);
leftWall.position.set(-ROOM_W / 2, ROOM_H / 2, 0);
leftWall.rotation.y = Math.PI / 2;
leftWall.receiveShadow = true;
scene.add(leftWall);
addBaseboard(-ROOM_W / 2 + 0.01, 0, ROOM_D, Math.PI / 2);

const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, ROOM_H), wallMat);
rightWall.position.set(ROOM_W / 2, ROOM_H / 2, 0);
rightWall.rotation.y = -Math.PI / 2;
rightWall.receiveShadow = true;
scene.add(rightWall);
addBaseboard(ROOM_W / 2 - 0.01, 0, ROOM_D, Math.PI / 2);

// Front wall with a door opening, so the room reads as a real, enclosed treatment room
{
  const doorWidth = 1.0;
  const doorHeight = 2.1;
  const sideWidth = (ROOM_W - doorWidth) / 2;

  const leftSeg = new THREE.Mesh(new THREE.PlaneGeometry(sideWidth, ROOM_H), wallMat);
  leftSeg.position.set(-ROOM_W / 2 + sideWidth / 2, ROOM_H / 2, ROOM_D / 2);
  leftSeg.rotation.y = Math.PI;
  leftSeg.receiveShadow = true;
  scene.add(leftSeg);

  const rightSeg = new THREE.Mesh(new THREE.PlaneGeometry(sideWidth, ROOM_H), wallMat);
  rightSeg.position.set(ROOM_W / 2 - sideWidth / 2, ROOM_H / 2, ROOM_D / 2);
  rightSeg.rotation.y = Math.PI;
  rightSeg.receiveShadow = true;
  scene.add(rightSeg);

  const lintel = new THREE.Mesh(new THREE.PlaneGeometry(doorWidth, ROOM_H - doorHeight), wallMat);
  lintel.position.set(ROOM_W / 2 - sideWidth - doorWidth / 2, doorHeight + (ROOM_H - doorHeight) / 2, ROOM_D / 2);
  lintel.rotation.y = Math.PI;
  lintel.receiveShadow = true;
  scene.add(lintel);

  const doorMat = new THREE.MeshStandardMaterial({ color: 0xcfd6d6, roughness: 0.4, metalness: 0.1 });
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xdfefef, roughness: 0.15, metalness: 0, transmission: 0.55, thickness: 0.05 });
  const doorGroup = new THREE.Group();
  const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, doorHeight, 0.06), doorMat);
  doorFrame.castShadow = true;
  doorGroup.add(doorFrame);
  const doorGlass = new THREE.Mesh(new THREE.PlaneGeometry(doorWidth * 0.55, doorHeight * 0.4), glassMat);
  doorGlass.position.set(0, doorHeight * 0.18, 0.031);
  doorGroup.add(doorGlass);
  doorGroup.position.set(ROOM_W / 2 - sideWidth - doorWidth / 2, doorHeight / 2, ROOM_D / 2 - 0.03);
  scene.add(doorGroup);

  addBaseboard(-ROOM_W / 2 + sideWidth / 2, ROOM_D / 2 - 0.01, sideWidth, 0);
  addBaseboard(ROOM_W / 2 - sideWidth / 2, ROOM_D / 2 - 0.01, sideWidth, 0);
}

const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, side: THREE.DoubleSide });
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilingMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ROOM_H;
scene.add(ceiling);

// --- Ambient + fill lighting ------------------------------------------------
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.HemisphereLight(0xffffff, 0xd7dcdb, 0.3));

function addDownlight(x, z, intensity = 45) {
  const spot = new THREE.SpotLight(0xfff6e8, intensity, 6.5, Math.PI / 6, 0.6, 1.4);
  spot.position.set(x, ROOM_H - 0.05, z);
  spot.target.position.set(x, 0, z);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  scene.add(spot, spot.target);

  const housing = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.04, 0.3),
    new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.5 })
  );
  housing.position.set(x, ROOM_H - 0.02, z);
  scene.add(housing);
}
addDownlight(-1.6, -1.4);
addDownlight(1.6, 0.6);
addDownlight(-1.4, 1.8, 30);

// --- Spannrahmen (tension-frame) panel builder -----------------------------
const glowPulses = [];

function createFramePanel({ width, height, texture, x, y, z, rotationY = 0, frameColor = 0xd8d8dc, glowColor = 0xffffff, glowIntensity = 6 }) {
  const group = new THREE.Group();
  const border = 0.06;
  const depth = 0.05;

  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(width + border * 2, height + border * 2, depth),
    new THREE.MeshStandardMaterial({ color: frameColor, roughness: 0.35, metalness: 0.5 })
  );
  frame.castShadow = true;
  group.add(frame);

  const panelMat = new THREE.MeshStandardMaterial({
    map: texture,
    emissiveMap: texture,
    emissive: 0xffffff,
    emissiveIntensity: 1.1,
    roughness: 0.6,
  });
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(width, height), panelMat);
  panel.position.z = depth / 2 + 0.005;
  group.add(panel);

  const glow = new THREE.PointLight(glowColor, glowIntensity, 3.2, 2);
  glow.position.set(0, 0, 0.4);
  group.add(glow);
  glowPulses.push({ light: glow, base: glowIntensity, mat: panelMat, baseEmissive: 1.1 });

  group.position.set(x, y, z);
  group.rotation.y = rotationY;
  scene.add(group);
  return group;
}

// Large modular "Spannrahmenwand" behind the treatment table — flagship product
createFramePanel({
  width: 4.2,
  height: 1.7,
  texture: texMeadowWide(),
  x: 0,
  y: 1.55,
  z: -ROOM_D / 2 + 0.05,
  glowColor: 0xdff5e0,
  glowIntensity: 7,
});

{
  const mullionMat = new THREE.MeshStandardMaterial({ color: 0xd8d8dc, roughness: 0.4, metalness: 0.5 });
  const tilesX = 3;
  const tileW = 4.2 / tilesX;
  for (let i = 1; i < tilesX; i++) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.02, 1.7, 0.07), mullionMat);
    bar.position.set(-2.1 + i * tileW, 1.55, -ROOM_D / 2 + 0.06);
    scene.add(bar);
  }
}

// Small accent panel on the right wall, above the supply cabinet
createFramePanel({
  width: 0.9,
  height: 1.3,
  texture: texWaterPanel(),
  x: ROOM_W / 2 - 0.05,
  y: 1.85,
  z: -1.4,
  rotationY: -Math.PI / 2,
  glowColor: 0xdaf0f5,
  glowIntensity: 4,
});

// Ceiling Spannrahmen panel, centered right above the treatment table
{
  const width = 1.8, height = 1.3;
  const border = 0.08, depth = 0.06;
  const group = new THREE.Group();

  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(width + border * 2, depth, height + border * 2),
    new THREE.MeshStandardMaterial({ color: 0xe7e7ea, roughness: 0.4, metalness: 0.4 })
  );
  group.add(frame);

  const tex = texSkyCeiling();
  const panelMat = new THREE.MeshStandardMaterial({
    map: tex,
    emissiveMap: tex,
    emissive: 0xffffff,
    emissiveIntensity: 1.25,
    roughness: 0.7,
    side: THREE.DoubleSide,
  });
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(width, height), panelMat);
  panel.rotation.x = Math.PI / 2;
  panel.position.y = -depth / 2 - 0.005;
  group.add(panel);

  const glow = new THREE.PointLight(0xdcefff, 10, 4, 2);
  glow.position.y = -0.5;
  group.add(glow);
  glowPulses.push({ light: glow, base: 10, mat: panelMat, baseEmissive: 1.25 });

  group.position.set(0.3, ROOM_H - 0.02, -0.4);
  scene.add(group);
}

// --- Treatment-room furniture ------------------------------------------------
const cabinetMat = new THREE.MeshStandardMaterial({ color: 0xf2f4f4, roughness: 0.45, metalness: 0.05 });
const cabinetAccentMat = new THREE.MeshStandardMaterial({ color: 0xaebfc2, roughness: 0.4, metalness: 0.1 });
const steelMat = new THREE.MeshStandardMaterial({ color: 0xc7cdd0, roughness: 0.25, metalness: 0.85 });
const padMat = new THREE.MeshStandardMaterial({ color: 0x8fb3ae, roughness: 0.7 });
const handleMat = new THREE.MeshStandardMaterial({ color: 0x999f9f, roughness: 0.3, metalness: 0.8 });

// Treatment table (Behandlungsliege), centerpiece facing the accent wall
function createTreatmentTable(x, z) {
  const group = new THREE.Group();

  const base = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.5, 1.7), steelMat);
  base.position.y = 0.25;
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);

  const top = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 1.9), padMat);
  top.position.y = 0.56;
  top.castShadow = true;
  top.receiveShadow = true;
  group.add(top);

  const headrest = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.1, 0.4), padMat);
  headrest.position.set(0, 0.66, -0.85);
  headrest.rotation.x = -0.15;
  headrest.castShadow = true;
  group.add(headrest);

  const paperRoll = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.66, 20), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }));
  paperRoll.rotation.z = Math.PI / 2;
  paperRoll.position.set(0, 0.72, 0.98);
  paperRoll.castShadow = true;
  group.add(paperRoll);

  const paperSheet = new THREE.Mesh(new THREE.PlaneGeometry(0.68, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, side: THREE.DoubleSide }));
  paperSheet.position.set(0, 0.44, 1.15);
  paperSheet.rotation.x = -0.35;
  group.add(paperSheet);

  group.position.set(x, 0, z);
  scene.add(group);
}
createTreatmentTable(0.2, -0.5);

// Wall-mounted articulated exam lamp, angled down toward the table
function createExamLamp(x, y, z) {
  const group = new THREE.Group();

  const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.1, 16), steelMat);
  mount.rotation.x = Math.PI / 2;
  group.add(mount);

  const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.55, 12), steelMat);
  arm1.position.set(0.05, -0.05, 0.25);
  arm1.rotation.x = Math.PI / 2.3;
  arm1.castShadow = true;
  group.add(arm1);

  const joint = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), steelMat);
  joint.position.set(0.05, -0.28, 0.48);
  group.add(joint);

  const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.45, 12), steelMat);
  arm2.position.set(0.05, -0.5, 0.62);
  arm2.rotation.x = Math.PI / 1.6;
  arm2.castShadow = true;
  group.add(arm2);

  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.1, 0.08, 24), new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3, metalness: 0.4 }));
  head.position.set(0.05, -0.72, 0.7);
  head.rotation.x = Math.PI / 2.2;
  head.castShadow = true;
  group.add(head);

  const bulb = new THREE.Mesh(
    new THREE.CircleGeometry(0.09, 24),
    new THREE.MeshStandardMaterial({ color: 0xfff8e0, emissive: 0xfff2c0, emissiveIntensity: 1.6 })
  );
  bulb.position.set(0.05, -0.76, 0.72);
  bulb.rotation.x = -1.1;
  group.add(bulb);

  const spot = new THREE.SpotLight(0xfff2d0, 22, 3, Math.PI / 7, 0.5, 1.2);
  spot.position.set(x + 0.05, y - 0.76, z + 0.72);
  spot.target.position.set(x + 0.1, 0.6, z + 1.2);
  scene.add(spot, spot.target);

  group.position.set(x, y, z);
  scene.add(group);
}
createExamLamp(-0.9, 2.3, -1.6);

// Sink counter with cabinet doors, faucet and a small mirror shelf, left wall
function createSinkCounter(x, z) {
  const group = new THREE.Group();

  const carcass = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 1.3), cabinetMat);
  carcass.position.y = 0.425;
  carcass.castShadow = true;
  carcass.receiveShadow = true;
  group.add(carcass);

  [-0.32, 0.32].forEach((dz) => {
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.7, 0.55), cabinetAccentMat);
    door.position.set(0.28, 0.42, dz);
    door.castShadow = true;
    group.add(door);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), handleMat);
    knob.position.set(0.29, 0.42, dz + (dz > 0 ? -0.22 : 0.22));
    group.add(knob);
  });

  const counterTop = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 1.36), steelMat);
  counterTop.position.y = 0.87;
  counterTop.castShadow = true;
  group.add(counterTop);

  const basin = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.12, 24), new THREE.MeshStandardMaterial({ color: 0xe9edee, roughness: 0.2, metalness: 0.2 }));
  basin.position.set(0.05, 0.85, -0.15);
  group.add(basin);

  const faucetBase = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.22, 10), steelMat);
  faucetBase.position.set(0.05, 0.98, -0.35);
  group.add(faucetBase);
  const faucetArc = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.012, 8, 16, Math.PI), steelMat);
  faucetArc.position.set(0.05, 1.08, -0.25);

// Rolling stool for the practitioner, head of the table
function createStool(x, z) {
  const group = new THREE.Group();

  const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.07, 24), padMat);
  seat.position.y = 0.52;
  seat.castShadow = true;
  group.add(seat);

  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.42, 12), steelMat);
  post.position.y = 0.3;
  group.add(post);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.03, 16), steelMat);
  hub.position.y = 0.08;
  group.add(hub);

  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const legArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.03), steelMat);
    legArm.position.set(Math.cos(angle) * 0.11, 0.06, Math.sin(angle) * 0.11);
    legArm.rotation.y = angle;
    group.add(legArm);
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.02, 10), new THREE.MeshStandardMaterial({ color: 0x2f2f2f, roughness: 0.6 }));
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(Math.cos(angle) * 0.21, 0.025, Math.sin(angle) * 0.21);
    group.add(wheel);
  }

  group.position.set(x, 0, z);
  scene.add(group);
}

// --- Resize handling -------------------------------------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Render loop -----------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  glowPulses.forEach((g, i) => {
    const pulse = 1 + Math.sin(t * 0.6 + i) * 0.06;
    g.light.intensity = g.base * pulse;
    g.mat.emissiveIntensity = g.baseEmissive * pulse;
  });
  controls.update();
  clampCameraToRoom();
  renderer.render(scene, camera);
}

loadingEl.style.display = "none";
animate();
